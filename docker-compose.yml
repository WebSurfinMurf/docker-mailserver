services:
  # ---------------------------------------------------------------------------
  # WireGuard peer for the AWS mail edge (34.194.247.228).
  #
  # This container OWNS the network namespace that `mailserver` runs inside
  # (see `network_mode: service:mail-edge-wg` below). Consequences:
  #   * wg0 / 10.77.0.2 exists inside that netns, so Postfix + Dovecot bind the
  #     tunnel address directly. No host port publishing, so no EADDRINUSE
  #     against Traefik, which still holds 0.0.0.0:{25,465,587,993}.
  #   * No host root required (there is no passwordless sudo on this host, so a
  #     host-level `wg-quick@wg0` unit is not installable autonomously).
  #   * Restarting THIS container destroys the netns. `mailserver` MUST be
  #     restarted afterwards - Docker will not do it for you.
  # ---------------------------------------------------------------------------
  mail-edge-wg:
    image: lscr.io/linuxserver/wireguard:1.0.20260223-r0-ls118
    container_name: mail-edge-wg
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      # Home peer config, generated by aws/mail-edge. Mode 600, never committed.
      - /home/administrator/projects/secrets/mail-edge-wg.conf:/config/wg_confs/wg0.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wg show wg0 >/dev/null 2>&1 && ping -c1 -W2 10.77.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      # Egress to reach the edge endpoint, plus reachability for postfixadmin.
      - mailserver-net

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    # `hostname:` is illegal alongside network_mode: service:* (Docker rejects it).
    # DMS's supported equivalent is OVERRIDE_HOSTNAME, set below.
    restart: unless-stopped
    stop_grace_period: 1m
    # Shares the WireGuard netns. NOTE: no `networks:`, no `ports:`, no Traefik
    # labels are permitted on a service using network_mode: service:*.
    network_mode: "service:mail-edge-wg"
    depends_on:
      mail-edge-wg:
        condition: service_healthy
    healthcheck:
      # Asserts BOTH that Postfix is listening AND that the inherited netns still
      # has a live wg0. Without the wg0 clause this container reports healthy
      # while being completely network-dead: restarting mail-edge-wg destroys the
      # namespace, but Postfix keeps listening inside the orphaned one, so the
      # port check alone still passes. Verified 2026-07-28.
      test: ["CMD-SHELL", "ss --listening --ipv4 --tcp | grep --silent ':smtp' && ip link show wg0 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    env_file: /home/administrator/projects/secrets/docker-mailserver.env
    environment:
      - OVERRIDE_HOSTNAME=mail.ai-servicers.com
    volumes:
      - /home/administrator/projects/data/docker-mailserver/mail:/var/mail
      - /home/administrator/projects/data/docker-mailserver/state:/var/mail-state
      - ./config:/tmp/docker-mailserver
      # Wildcard cert dir, not the apex-only "ai-servicers.com" dir: OVERRIDE_HOSTNAME
      # above is mail.ai-servicers.com, and clients (Nextcloud Mail) verify that SAN.
      # The dir name is literally "*.ai-servicers.com" — quoted because a plain YAML
      # scalar starting with `*` is an alias reference; this string doesn't start
      # with `*` so it isn't ambiguous, but quote it anyway so no future edit makes
      # it one. Not a shell glob — Compose passes bind-mount sources through literally.
      - "/home/administrator/projects/data/traefik-certs/*.ai-servicers.com:/certs:ro"
      - /etc/localtime:/etc/localtime:ro
    cap_add:
      - NET_ADMIN

  postfixadmin:
    image: postfixadmin/postfixadmin:latest
    container_name: postfixadmin
    restart: unless-stopped
    profiles: ["postfixadmin"]   # not part of the default stack; DMS uses ACCOUNT_PROVISIONER=FILE
    environment:
      - POSTFIXADMIN_DB_TYPE=sqlite
      - POSTFIXADMIN_SETUP_PASSWORD=${POSTFIXADMIN_SETUP_PASSWORD:-changeme123}
      # mailserver has no DNS name of its own - it lives in mail-edge-wg's netns.
      - POSTFIXADMIN_SMTP_SERVER=mail-edge-wg
      - POSTFIXADMIN_SMTP_PORT=25
      - POSTFIXADMIN_ENCRYPT=dovecot:BLF-CRYPT
      - POSTFIXADMIN_DOMAIN=ai-servicers.com
    volumes:
      - /home/administrator/projects/data/docker-mailserver/postfixadmin:/var/lib/postfixadmin
    networks:
      - mailserver-net
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.postfixadmin.rule=Host(`postfixadmin.ai-servicers.com`)"
      - "traefik.http.routers.postfixadmin.entrypoints=websecure"
      - "traefik.http.routers.postfixadmin.tls=true"
      - "traefik.http.routers.postfixadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.postfixadmin.loadbalancer.server.port=80"
      - "traefik.http.routers.postfixadmin.middlewares=auth@docker"

networks:
  mailserver-net:
    external: true
  traefik-net:
    external: true
